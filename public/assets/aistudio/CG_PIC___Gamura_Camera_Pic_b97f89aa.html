<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b08">
<title>CG PIC – Gamura Camera Pic</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--line:#2c2c2e;--ac:#30d158;--tx:#f5f5f7;--mt:#8e8e93;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.view{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.view.on{display:flex}
#v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;transition:transform .15s}
.top{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;z-index:5}
.top .brand{font-weight:800;letter-spacing:.5px;font-size:18px;text-shadow:0 1px 8px #000}
.top .brand b{color:var(--ac)}
.ib{width:42px;height:42px;border-radius:50%;background:rgba(5,11,8,.55);backdrop-filter:blur(8px);display:inline-grid;place-items:center;font-size:17px;margin-left:8px;border:1px solid rgba(255,255,255,.12)}
.ib.act{background:var(--ac);color:#04130c;border-color:var(--ac)}
#grid{position:absolute;inset:0;pointer-events:none;display:none;background:linear-gradient(90deg,transparent 33.2%,rgba(255,255,255,.35) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.35) 66.6%,transparent 66.8%),linear-gradient(transparent 33.2%,rgba(255,255,255,.35) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.35) 66.6%,transparent 66.8%)}
#fl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8;transition:opacity .25s}
#cd{position:absolute;inset:0;display:none;place-items:center;font-size:120px;font-weight:800;z-index:7;text-shadow:0 4px 30px #000;pointer-events:none}
#nocam{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:30px;z-index:3;background:var(--bg)}
#nocam p{color:var(--mt);max-width:300px;margin:0;line-height:1.5}
.bot{position:absolute;bottom:0;left:0;right:0;padding:10px 0 calc(14px + env(safe-area-inset-bottom,0px));z-index:5;background:linear-gradient(transparent,rgba(5,11,8,.85) 40%)}
.zm{display:flex;justify-content:center;margin-bottom:8px}
.zm{gap:14px}.zm input{width:40%}.act button{border-radius:16px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:99px;background:rgba(15,28,22,.8);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip.on{background:var(--ac);color:#04130c;border-color:var(--ac);font-weight:700}
.row{display:flex;align-items:center;justify-content:space-around;padding:0 16px}
.shut{width:78px;height:78px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
.shut i{width:60px;height:60px;border-radius:50%;background:#fff;transition:transform .1s}
.shut:active i{transform:scale(.88);background:var(--ac)}
.side{width:54px;height:54px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;overflow:hidden;position:relative}
.side img{width:100%;height:100%;object-fit:cover}
.side em{position:absolute;right:3px;top:3px;background:var(--ac);color:#04130c;border-radius:99px;font-size:10px;font-style:normal;font-weight:800;padding:1px 5px}
/* editor */
.eh{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.eh .t{font-weight:700}
.tbtn{padding:9px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:14px}
.tbtn.p{background:var(--ac);color:#04130c;border-color:var(--ac);font-weight:700}
#stage{flex:1;min-height:0;display:grid;place-items:center;padding:6px 12px;background:#000}
#cv{max-width:100%;max-height:100%;border-radius:6px;box-shadow:0 0 0 1px var(--line)}
.tabs{display:flex;margin:8px 14px;padding:3px;background:var(--card);border-radius:12px}
.tabs button{flex:1;padding:9px;color:var(--mt);font-size:13px;font-weight:600;border-radius:9px}
.tabs button.on{color:var(--tx);background:#3a3a3c}
.panel{height:158px;overflow-y:auto;padding:10px 14px;display:none}
.panel.on{display:block}
.th{flex:none;width:68px;text-align:center;font-size:11px;color:var(--mt)}
.th canvas{width:68px;height:68px;border-radius:10px;display:block;border:2px solid transparent;object-fit:cover}
.th.on canvas{border-color:var(--ac)}
.th.on{color:var(--ac)}
.sl{display:grid;grid-template-columns:92px 1fr 36px;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.sl output{color:var(--mt);text-align:right;font-size:12px}
input[type=range]{accent-color:var(--ac);width:100%}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.act{display:flex;gap:8px;padding:8px 14px calc(12px + env(safe-area-inset-bottom,0px))}
.act button{flex:1;padding:13px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:600}
.act .p{background:var(--ac);color:#04130c;border-color:var(--ac)}
/* gallery */
#gg{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;align-content:start}
#gg img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px}
.empty{grid-column:1/-1;text-align:center;color:var(--mt);padding:60px 20px;line-height:1.6}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--card);border:1px solid var(--ac);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.on{opacity:1}
.ib{width:38px;height:38px;margin-left:6px;font-size:15px}
.top{padding:10px 12px;background:linear-gradient(rgba(0,0,0,.5),transparent)}
.zp{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:10px}
.zp button{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);font-size:12px;font-weight:700}
.zp button.on{width:40px;height:40px;color:#ffd60a}
.modes{justify-content:center;gap:20px;padding:2px 14px 12px}
.mode{flex:none;font-size:12.5px;font-weight:700;letter-spacing:.8px;opacity:.6;padding:4px 0}
.mode.on{color:#ffd60a;opacity:1}
#mask{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 100vmax rgba(0,0,0,.5);pointer-events:none;display:none;z-index:2}
#fx{position:absolute;width:72px;height:72px;border:1.5px solid #ffd60a;border-radius:6px;display:none;z-index:6;pointer-events:none}
#fx input{position:absolute;top:80px;left:-14px;width:100px;pointer-events:auto;accent-color:#ffd60a}
#fx.pop{animation:pop .25s}
@keyframes pop{from{transform:scale(1.4);opacity:.3}}
#lvl{position:absolute;left:50%;top:50%;width:150px;height:2px;background:#fff;display:none;z-index:2;pointer-events:none;transform:translate(-50%,-50%)}
#lvl.ok{background:#ffd60a}
#rec{position:absolute;top:calc(env(safe-area-inset-top,0px) + 62px);left:50%;transform:translateX(-50%);background:#ff453a;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700;display:none;z-index:6}
.shut.vid i{background:#ff453a}.shut.rec i{border-radius:14px;transform:scale(.55)}
.eh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.eh>:first-child{justify-self:start}.eh>:last-child{justify-self:end}
.panel{height:176px}
.cap{width:100%;margin-top:10px;padding:11px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--tx);font:inherit;outline:0}
</style></head>
<body>

<div id="cam" class="view on">
  <video id="v" playsinline autoplay muted></video>
  <div id="grid"></div><div id="mask"></div><div id="fx"><input type="range" id="ex2" min="-50" max="50" value="0" aria-label="Exposure"></div><div id="lvl"></div><div id="rec"></div><div id="fl"></div><div id="cd"></div>
  <div id="nocam">
    <div style="font-size:44px">📷</div>
    <p id="ncm">Camera access is blocked here. Allow camera permission, or use your phone’s camera app below.</p>
    <button class="tbtn p" id="retry">Try camera again</button>
    <button class="tbtn" id="nat">Open phone camera</button>
  </div>
  <div class="top">
    <div class="brand">CG <b>PIC</b></div>
    <div>
      <button class="ib" id="bFlash" title="Flash">⚡</button>
      <button class="ib" id="bTimer" title="Timer">⏱</button>
      <button class="ib" id="bGrid" title="Grid">▦</button>
      <button class="ib" id="bHdr" title="HDR" style="font-size:11px;font-weight:800">HDR</button><button class="ib" id="bRatio" title="Aspect ratio" style="font-size:11px;font-weight:800">4:3</button><button class="ib" id="bUp" title="Import photo">⤒</button>
    </div>
  </div>
  <div class="bot">
    <div class="zp" id="zp"></div><div class="zm" style="display:none"><input type="range" id="zm" min="1" max="3" step="0.1" value="1" aria-label="Zoom"><input type="range" id="ex" min="-50" max="50" step="1" value="0" aria-label="Exposure"></div>
    <div class="strip" id="fs"></div>
    <div class="strip modes" id="ms"></div><div class="row">
      <button class="side" id="bGal">🖼<em id="cnt" style="display:none">0</em></button>
      <button class="shut" id="shut" aria-label="Take photo"><i></i></button>
      <button class="side" id="bFlip" title="Flip camera">⟲</button>
    </div>
  </div>
</div>

<div id="edit" class="view">
  <div class="eh"><button class="tbtn" id="eBack">‹ Camera</button><div class="t">Edit photo</div><button class="tbtn" id="eGal">Gallery</button></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div class="tabs"><button data-t="pf" class="on">Filters</button><button data-t="pa">Adjust</button><button data-t="pt">Tools</button></div>
  <div class="panel on" id="pf">
    <div class="strip" id="ths" style="padding:0 0 8px"></div>
    <div class="sl"><span>Intensity</span><input type="range" id="int" min="0" max="100" value="100"><output id="intO">100</output></div>
  </div>
  <div class="panel" id="pa"></div>
  <div class="panel" id="pt">
    <div class="tools" style="margin-bottom:10px">
      <button class="tbtn" id="rl">⟲ Rotate left</button><button class="tbtn" id="rr">⟳ Rotate right</button><button class="tbtn" id="fh">⇋ Mirror</button>
    </div>
    <div class="sl"><span>Straighten</span><input type="range" id="ang" min="-15" max="15" step="0.5" value="0"><output id="angO">0°</output></div>
    <div class="tools" id="crops"></div>
    <div class="tools" style="margin-top:10px"><button class="tbtn" id="frm">Frame: none</button><button class="tbtn" id="wm">Watermark: off</button></div>
    <input id="cap" class="cap" placeholder="Add a caption (optional)" maxlength="60">
    <div class="tools" style="margin-top:10px">
      <button class="tbtn" id="cmp">Hold to see original</button><button class="tbtn" id="rst">Reset all</button>
    </div>
  </div>
  <div class="act"><button id="eNew">Retake</button><button id="eShare">Share</button><button class="p" id="eSave">Save to phone</button></div>
</div>

<div id="gal" class="view">
  <div class="eh"><button class="tbtn" id="gBack">‹ Camera</button><div class="t">This session</div><span style="width:70px"></span></div>
  <div id="gg"></div>
</div>

<input type="file" id="fNat" accept="image/*" capture="environment" hidden>
<input type="file" id="fUp" accept="image/*" hidden>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
// name, params (b,c,s,w = -100..100 · t tint · g gray · sp sepia · fade/vig/grain 0..1)
const P=[
["Natural",{}],["Vivid",{s:38,c:14}],["Portrait",{c:8,s:-4,w:9,b:5,vig:.2,fade:.05}],
["Noir",{g:1,c:28,vig:.45}],["Silver",{g:1,c:-6,b:7,fade:.22}],["Warm",{w:32,s:10,b:5}],
["Ice",{w:-32,c:8,s:5}],["Emerald",{w:-12,s:16,c:10,t:30}],["Vintage",{sp:.5,fade:.4,vig:.4,grain:.5,w:15}],
["Cinema",{c:22,s:-12,w:-8,t:12,vig:.5}],["Pop",{s:62,c:22,b:5}],["Dream",{b:10,c:-12,fade:.3,w:10,s:10}],["Film",{grain:.7,fade:.25,c:10,w:8,s:-8}],["Chrome",{c:20,s:-8,b:4,fade:.08}],["Matte",{fade:.45,c:-6,s:-10}],["Mono",{g:1,c:12,fade:.1}],["Sunset",{w:45,s:20,c:8,t:-8,vig:.25}],["Teal Orange",{w:14,t:20,c:20,s:14,vig:.3}],["Moody",{b:-10,c:25,s:-18,vig:.55,w:-6}],["Golden",{w:38,b:8,s:14,fade:.1,vig:.2}],["Crisp",{c:25,s:12,b:3}],["Kodak",{w:18,s:8,c:12,fade:.15,grain:.35,sp:.12}],["Lomo",{s:35,c:30,vig:.7,grain:.3,t:10}],["Neon",{s:90,c:30,t:25,w:-20}],["Pastel",{b:12,c:-18,s:-10,fade:.3,w:6}],["Drama",{c:40,s:-15,vig:.5,b:-4}]
];
const ADJ=[["b","Brightness",-60,60],["c","Contrast",-60,60],["s","Saturation",-100,100],["w","Warmth",-60,60],["fade","Fade",0,100],["vig","Vignette",0,100],["grain","Grain",0,100],["t","Tint",-60,60],["sh","Shadows",-60,60],["hi","Highlights",-60,60],["sharp","Sharpness",0,100]];
const CROPS=[["Original",null],["1:1",[1,1]],["4:5",[4,5]],["3:4",[3,4]],["16:9",[16,9]],["9:16",[9,16]]];
let stream,facing="environment",tmr=0,flash=false,zoom=1,live=0,ed=null,base=null,showOrig=false,busy=false;
const photos=[];

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2200)}
function show(id){document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id===id));if(id==="cam")startCam();else stopCam()}
const css=p=>`brightness(${1+(p.b||0)/100}) contrast(${1+(p.c||0)/100}) saturate(${1+(p.s||0)/100}) grayscale(${p.g||0}) sepia(${(p.sp||0)*.6}) hue-rotate(${-(p.w||0)*.2}deg)`;

// ---------- camera ----------
async function startCam(){
  stopCam();
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080}},audio:mode==="VIDEO"});
    $("#v").srcObject=stream;$("#nocam").style.display="none";liveFx();
  }catch(e){$("#nocam").style.display="flex"}
}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function liveFx(){const v=$("#v");v.style.filter=css(P[live][1])+` brightness(${1+expo/100})`;v.style.transform=(facing==="user"?"scaleX(-1) ":"")+`scale(${zoom})`}
function buildStrip(){
  $("#fs").innerHTML=P.map((p,i)=>`<button class="chip${i===live?" on":""}" data-i="${i}">${p[0]}</button>`).join("");
}
$("#fs").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;live=+b.dataset.i;buildStrip();liveFx()};
$("#zm").oninput=e=>{zoom=+e.target.value;liveFx()};
$("#bFlip").onclick=()=>{facing=facing==="user"?"environment":"user";startCam()};
$("#bGrid").onclick=e=>{const g=$("#grid");const on=g.style.display!=="block";g.style.display=on?"block":"none";e.currentTarget.classList.toggle("act",on)};
$("#bTimer").onclick=e=>{tmr={0:3,3:5,5:10,10:0}[tmr];e.currentTarget.textContent=tmr?tmr+"s":"⏱";e.currentTarget.classList.toggle("act",!!tmr)};
$("#bFlash").onclick=e=>{flash=!flash;e.currentTarget.classList.toggle("act",flash);toast(flash?"Flash on":"Flash off")};
$("#retry").onclick=startCam;
$("#nat").onclick=()=>$("#fNat").click();
$("#bUp").onclick=()=>$("#fUp").click();
$("#bGal").onclick=()=>{drawGal();show("gal")};
$("#shut").onclick=async()=>{
  if(mode==="VIDEO"){toggleRec();return}if(busy)return;busy=true;
  if(!stream){$("#fNat").click();busy=false;return}
  if(tmr){const cd=$("#cd");cd.style.display="grid";for(let i=tmr;i>0;i--){cd.textContent=i;await new Promise(r=>setTimeout(r,1000))}cd.style.display="none"}
  let torch=false;const tr=stream.getVideoTracks()[0];
  if(flash){if(facing==="user"){const f=$("#fl");f.style.opacity=.95;await new Promise(r=>setTimeout(r,250))}
    else try{await tr.applyConstraints({advanced:[{torch:true}]});torch=true;await new Promise(r=>setTimeout(r,300))}catch(e){}}
  const v=$("#v"),w=v.videoWidth,h=v.videoHeight,m=maskBox(),k=Math.max(m.W/w,m.H/h),cw=Math.min(w,m.mw/k/zoom),ch=Math.min(h,m.mh/k/zoom),c=document.createElement("canvas");
  c.width=cw;c.height=ch;const x=c.getContext("2d");
  if(facing==="user"){x.translate(cw,0);x.scale(-1,1)}
  x.drawImage(v,(w-cw)/2,(h-ch)/2,cw,ch,0,0,cw,ch);
  $("#fl").style.opacity=0;
  if(torch)try{await tr.applyConstraints({advanced:[{torch:false}]})}catch(e){}
  c.cam=1;c.hdr=hdr;beep();addPhoto(c,live);busy=false;
};
function loadFile(f){
  if(!f)return;const img=new Image();
  img.onload=()=>{const m=3000,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);addPhoto(c,0)};
  img.src=URL.createObjectURL(f);
}
$("#fNat").onchange=e=>{loadFile(e.target.files[0]);e.target.value=""};
$("#fUp").onchange=e=>{loadFile(e.target.files[0]);e.target.value=""};

// ---------- photos / editor ----------
function addPhoto(src,pi){
  const t=document.createElement("canvas");const s=240/Math.max(src.width,src.height);t.width=src.width*s;t.height=src.height*s;
  t.getContext("2d").drawImage(src,0,0,t.width,t.height);
  const ph={src,pi,int:100,adj:{b:src.cam?expo:0,c:0,s:0,w:0,fade:0,vig:0,grain:0,t:0,sh:src.hdr?28:0,hi:src.hdr?-22:0,sharp:0},ang:0,frame:null,wm:false,rot:0,flip:false,crop:null,thumb:t.toDataURL("image/jpeg",.7)};
  photos.unshift(ph);updCnt();openEd(ph);
}
function updCnt(){const c=$("#cnt");c.textContent=photos.length;c.style.display=photos.length?"block":"none"}
function params(p0){
  const b=P[ed.pi][1],k=ed.int/100,a=ed.adj,g=n=>(b[n]||0)*k;
  return{b:g("b")+a.b,c:Math.max(-95,Math.min(95,g("c")+a.c)),s:g("s")+a.s,w:g("w")+a.w,t:g("t")+a.t,sh:a.sh,hi:a.hi,sharp:a.sharp/100,fade:g("fade")+a.fade/100,vig:g("vig")+a.vig/100,grain:g("grain")+a.grain/100,g:g("g"),sp:g("sp")};
}
function geo(maxD){
  const src=ed.src,r=ed.rot%2,w=src.width,h=src.height,cw=r?h:w,ch=r?w:h;
  const c=document.createElement("canvas");c.width=cw;c.height=ch;const x=c.getContext("2d");
  const A=Math.abs(ed.ang||0)*Math.PI/180,sc=Math.cos(A)+Math.max(cw/ch,ch/cw)*Math.sin(A);x.translate(cw/2,ch/2);x.rotate(ed.rot*Math.PI/2+(ed.ang||0)*Math.PI/180);x.scale(sc,sc);if(ed.flip)x.scale(-1,1);x.drawImage(src,-w/2,-h/2);
  let tw=cw,th=ch,ox=0,oy=0;
  if(ed.crop){const[a,b]=ed.crop;tw=cw;th=cw*b/a;if(th>ch){th=ch;tw=ch*a/b}ox=(cw-tw)/2;oy=(ch-th)/2}
  const s=Math.min(1,maxD/Math.max(tw,th)),o=document.createElement("canvas");o.width=Math.round(tw*s);o.height=Math.round(th*s);
  o.getContext("2d").drawImage(c,ox,oy,tw,th,0,0,o.width,o.height);return o;
}
function proc(src,p){
  const w=src.width,h=src.height,c=document.createElement("canvas");c.width=w;c.height=h;
  const x=c.getContext("2d");x.drawImage(src,0,0);const im=x.getImageData(0,0,w,h),d=im.data;
  const k=p.c*2.55,cf=(259*(k+255))/(255*(259-k)),sat=Math.max(0,1+p.s/100),B=p.b*2.55,W=p.w*.5,T=p.t*.3,cx=w/2,cy=h/2,md=cx*cx+cy*cy;
  for(let y=0,i=0;y<h;y++){const dy=(y-cy)*(y-cy);

$("#ex").oninput=e=>{expo=+e.target.value;liveFx()};

const RAT=[["4:3",4,3],["1:1",1,1],["16:9",16,9]],MODES=["PHOTO","SQUARE","PORTRAIT","B&W","VIDEO"];
