<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gamura Calc</title>
<style>
:root{--f:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f2f2f7;--c:#fff;--tx:#1c1c1e;--mut:#8e8e93;--bd:rgba(60,60,67,.12);--k2:#e9e9ee;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{min-height:100%;background:var(--bg);color:var(--tx);font-family:var(--f);overflow-x:hidden}
.app{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:8px 14px 96px}
.scr{display:none;flex-direction:column;gap:10px;flex:1}.scr.on{display:flex}
.hd{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 0}

.ib{width:38px;height:38px;border-radius:50%;border:0;background:var(--c);box-shadow:0 0 0 1px var(--bd);font-size:17px;cursor:pointer}
.card{background:var(--c);border-radius:24px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 0 0 1px var(--bd);padding:14px 16px}
.disp{min-height:132px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;gap:2px;overflow:hidden}
.badges{display:flex;gap:8px;font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.08em;height:15px}
.ex{font-size:22px;color:var(--mut);word-break:break-all;text-align:right;max-height:60px;overflow:hidden;min-height:28px}
.res{font-weight:300;letter-spacing:-.03em;line-height:1.05;cursor:pointer;white-space:nowrap;font-size:60px;font-variant-numeric:tabular-nums}
.mrow{display:flex;justify-content:space-between;padding:0 4px}
.mrow .k{width:22%;height:30px;border-radius:12px;font-size:13px;font-weight:600;color:var(--mut)}
.main{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:minmax(54px,1fr);gap:8px;flex:1;min-height:400px}
button.k{border:0;background:var(--c);color:var(--tx);font:400 24px var(--f);border-radius:20px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px var(--bd);transition:transform .08s,background .12s}
button.k:active{transform:scale(.92);background:#e5e5ea}
.k.fn{font-size:16px;font-weight:500;background:#f8f8fb}
.k.op{background:var(--k2);font-size:28px;font-weight:500}
.k.ac{background:var(--k2);font-size:20px;font-weight:500}
.k.eq{background:linear-gradient(145deg,#3a3a3c,#000);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.k.on{background:var(--tx);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-top:6px}
.tile{background:var(--c);border:0;border-radius:22px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 0 0 1px var(--bd);padding:16px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font:600 13px var(--f);color:var(--tx);cursor:pointer}
.tile:active{transform:scale(.95)}.tile span{font-size:30px}
.tabs{position:fixed;left:0;right:0;bottom:0;max-width:440px;margin:0 auto;display:flex;background:rgba(255,255,255,.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--bd);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:4}
.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11px var(--f);color:var(--mut);cursor:pointer}
.tabs button span{font-size:22px;filter:grayscale(1);opacity:.6}.tabs button.on{color:var(--tx)}.tabs button.on span{filter:none;opacity:1}
.panel{position:fixed;top:0;bottom:0;left:0;right:0;max-width:440px;margin:0 auto;background:var(--bg);z-index:6;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.9,.3,1);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(30px + env(safe-area-inset-bottom,0px))}
.panel.open{transform:none}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:12px}.ph button{border:0;background:none;font:600 17px var(--f);color:var(--tx);cursor:pointer;padding:6px}
.ph h2{font-size:22px;flex:1;text-align:center;margin-right:40px}
.note{font-size:12px;color:var(--mut);padding:0 6px 10px}
.fl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.fl:last-child{border:0}.fl span{font-size:15px;color:var(--mut);flex:0 0 40%}
.fl input,.fl select{flex:1;min-width:0;text-align:right;border:0;background:transparent;font:500 17px var(--f);color:var(--tx);outline:0;direction:ltr}
.out{margin-top:12px}.gz{display:flex;gap:8px;align-items:center;padding-top:8px}.gz .note{padding:0;margin-left:auto}.row.cp{cursor:pointer}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd);font-size:15px}
.row:last-child{border:0}.row span{color:var(--mut)}.row b{font-weight:600;text-align:right;word-break:break-word}
.row.big{flex-direction:column;align-items:flex-start;gap:2px}.row.big b{font-size:34px;font-weight:300;text-align:left}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;max-width:440px;margin:0 auto;background:rgba(255,255,255,.96);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:28px 28px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.15);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1);max-height:65%;display:flex;flex-direction:column}
.sheet.open{transform:none}
.sh{display:flex;justify-content:space-between;margin-bottom:8px;font-weight:700}.sh button{border:0;background:none;font:600 14px var(--f);color:var(--tx);cursor:pointer;margin-left:10px}
.hl{overflow:auto}.hi{padding:10px 4px;border-bottom:1px solid var(--bd);text-align:right;cursor:pointer}
.hi small{display:block;color:var(--mut);font-size:14px}.hi b{font-weight:500;font-size:22px}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%) translateY(-80px);background:var(--tx);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:9;transition:transform .3s}
.toast.show{transform:translateX(-50%) translateY(0)}
@media (max-height:720px){.disp{min-height:100px}.res{font-size:46px}}
</style></head><body>
<div class="app">
 <div id="s0" class="scr on">
  <div class="hd"><h1>Calculator</h1><button class="ib" id="hisB" aria-label="History">⏱</button></div>

</div>

<script>
const $=id=>document.getElementById(id);
let ex='',deg=true,mem=0,fresh=false,alt=false,hist=[],lastRes='0',tabNow=0;
try{hist=JSON.parse(localStorage.getItem('gc_h2')||'[]')}catch(e){hist=[]}
const MAIN=[['2nd','fn'],['deg','fn'],['sin','fn'],['cos','fn'],['tan','fn'],['xʸ','fn'],['lg','fn'],['ln','fn'],['(','fn'],[')','fn'],['√','fn'],['AC','ac'],['⌫','ac'],['%','ac'],['÷','op'],['x!','fn'],['7'],['8'],['9'],['×','op'],['1/x','fn'],['4'],['5'],['6'],['−','op'],['π','fn'],['1'],['2'],['3'],['+','op'],['±','fn'],['ℯ','fn'],['0'],['.'],['=','eq']];
const ALT={sin:'asin',cos:'acos',tan:'atan','xʸ':'x²',lg:'10ˣ',ln:'eˣ','√':'∛','x!':'abs','1/x':'x³'};
const LBL={asin:'sin⁻¹',acos:'cos⁻¹',atan:'tan⁻¹','x²':'x²','10ˣ':'10ˣ','eˣ':'eˣ','∛':'∛',abs:'|x|','x³':'x³'};
function mk(c,l,cls){const b=document.createElement('button');b.className='k '+(cls||'');b.textContent=l;b.dataset.k=l;c.appendChild(b)}
MAIN.forEach(([l,c])=>mk($('main'),l,c));['MC','MR','M+','M−'].forEach(l=>mk($('mrow'),l,'mm'));
const B=r=>deg?r*180/Math.PI:r,A=x=>deg?x*Math.PI/180:x;
const FN={sin:x=>Math.sin(A(x)),cos:x=>Math.cos(A(x)),tan:x=>Math.tan(A(x)),asin:x=>B(Math.asin(x)),acos:x=>B(Math.acos(x)),atan:x=>B(Math.atan(x)),ln:Math.log,lg:Math.log10,'√':Math.sqrt,'∛':Math.cbrt,abs:Math.abs};
function fact(v){if(v<0||v%1||v>170)throw 0;let r=1;for(let i=2;i<=v;i++)r*=i;return r}
function tok(s){s=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');const t=[],re=/\d+\.?\d*(?:e[+-]?\d+)?|\.\d+|[a-z]+|[+\-*\/^()!%√∛πℯ]/y;let i=0,m;while(i<s.length){re.lastIndex=i;m=re.exec(s);if(!m)throw 0;t.push(m[0]);i=re.lastIndex}return t}
function ev(src,vars){const o=(src.match(/\(/g)||[]).length-(src.match(/\)/g)||[]).length;if(o>0)src+=')'.repeat(o);const T=tok(src);let p=0;const pk=()=>T[p],nx=()=>T[p++];
const ad=()=>{let v=tm();while(pk()=='+'||pk()=='-'){const o=nx(),r=tm();v=o=='+'?v+r:v-r}return v};
const tm=()=>{let v=un();for(;;){const k=pk();if(k=='*'||k=='/'){nx();const r=un();v=k=='*'?v*r:v/r}else if(k&&/^[\d.a-zπℯ√∛(]/.test(k)){v*=un()}else break}return v};
const un=()=>{if(pk()=='-'){nx();return -un()}if(pk()=='+'){nx();return un()}return pw()};
const pw=()=>{const b=po();if(pk()=='^'){nx();return Math.pow(b,un())}return b};
const po=()=>{let v=pr();while(pk()=='!'||pk()=='%')v=nx()=='!'?fact(v):v/100;return v};
const pr=()=>{const k=nx();if(k===undefined)throw 0;if(k=='('){const v=ad();if(nx()!=')')throw 0;return v}
if(k=='π')return Math.PI;if(k=='ℯ')return Math.E;if(k=='x'&&vars)return vars.x;if(/^[\d.]/.test(k))return parseFloat(k);
const f=FN[k];if(!f||nx()!='(')throw 0;const v=ad();if(nx()!=')')throw 0;const r=f(v);return Math.abs(r)<1e-14?0:r};
const v=ad();if(p<T.length||!isFinite(v))throw 0;return v}
function fmt(n){if(n===0)return'0';if(Math.abs(n)>=1e15||Math.abs(n)<1e-9)return n.toExponential(8).replace(/\.?0+e/,'e');return String(parseFloat(n.toPrecision(12)))}
function sync(){const e=$('ex');let r='0',pv=null;
 if(ex){try{pv=fmt(ev(ex))}catch(_){}}
 if(fresh){r=ex||'0';e.textContent=hist[0]?hist[0].e+' =':''}
 else{e.textContent=ex;r=!ex?'0':(pv!==null?pv:lastRes)}
 $('res').textContent=r;lastRes=r;
 $('res').style.fontSize=Math.max(28,Math.min(innerHeight<720?46:60,310/r.length*1.7))+'px';
 $('bd').textContent=deg?'DEG':'RAD';$('bm').textContent=mem?'M':'';document.querySelector('[data-k="deg"]').textContent=deg?'deg':'rad'}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1300)}
function curVal(){try{return ev(ex||'0')}catch(_){return null}}
function press(k){try{navigator.vibrate&&navigator.vibrate(6)}catch(_){}
 const isD=/^\d$/.test(k),isOp='+−×÷'.includes(k)&&k.length==1;
 if(fresh){if(isD||k=='.'||k=='π'||k=='ℯ'||k=='('||FN[k]||k=='10ˣ'||k=='eˣ')ex='';fresh=false}
 if(isD)ex+=k;
 else if(k=='.'){const cur=(ex.match(/[\d.]*$/)||[''])[0];if(!cur.includes('.'))ex+=(cur?'':'0')+'.'}
 else if(isOp){if(!ex&&k!='−')ex='0';if(/[+−×÷^]$/.test(ex)){if(ex.length>1)ex=ex.slice(0,-1)+k}else ex+=k}
 else if(k=='AC')ex='';
 else if(k=='⌫'){ex=ex.replace(/(asin|acos|atan|abs|sin|cos|tan|ln|lg|√|∛)\($/,'')==ex?ex.slice(0,-1):ex.replace(/(asin|acos|atan|abs|sin|cos|tan|ln|lg|√|∛)\($/,'')}
 else if(k=='%')ex+=ex?'%':'';
 else if(k=='±'){const m=ex.match(/\(−(\d+\.?\d*)\)$/);if(m)ex=ex.slice(0,-m[0].length)+m[1];else{const n=ex.match(/\d+\.?\d*$/);if(n)ex=ex.slice(0,-n[0].length)+'(−'+n[0]+')'}}
 else if(k=='='){if(!ex)return;try{const r=fmt(ev(ex));hist.unshift({e:ex,r});hist=hist.slice(0,50);try{localStorage.setItem('gc_h2',JSON.stringify(hist))}catch(_){}ex=r;fresh=true}catch(_){toast('Invalid expression')}}
 else if(k=='deg')deg=!deg;
 else if(k=='x²')ex+=ex?'^2':'';
 else if(k=='x³')ex+=ex?'^3':'';
 else if(k=='xʸ')ex+=ex?'^':'';
 else if(k=='x!')ex+=ex?'!':'';
 else if(k=='10ˣ')ex+='10^(';
 else if(k=='eˣ')ex+='ℯ^(';
 else if(k=='1/x'){if(ex)ex='1÷('+ex+')'}
 else if(k=='π'||k=='ℯ'||k=='('||k==')')ex+=k;
 else if(FN[k])ex+=k+'(';
 else if(k=='MC'){mem=0;toast('Memory cleared')}
 else if(k=='MR'){if(mem)ex+=fmt(mem)}
 else if(k=='M+'||k=='M−'){const v=curVal();if(v!==null){mem+=k=='M+'?v:-v;toast('Memory '+fmt(mem))}}
 sync()}
document.addEventListener('click',e=>{const b=e.target.closest('button.k');if(!b)return;let k=b.dataset.k;
 if(k=='2nd'){alt=!alt;b.classList.toggle('on',alt);document.querySelectorAll('#main [data-k]').forEach(x=>{const a=ALT[x.dataset.k];if(a)x.textContent=alt?LBL[a]:x.dataset.k});return}
 if(alt&&ALT[k])k=ALT[k];press(k)});
const KM={'*':'×','/':'÷','-':'−','+':'+','^':'xʸ','(':'(',')':')','.':'.','%':'%','!':'x!','Enter':'=','=':'=','Backspace':'⌫','Escape':'AC'};
document.addEventListener('keydown',e=>{if(tabNow!=0||$('panel').classList.contains('open')||e.ctrlKey||e.metaKey)return;const k=/^\d$/.test(e.key)?e.key:KM[e.key];if(k){e.preventDefault();press(k)}});
$('res').onclick=()=>{try{navigator.clipboard.writeText($('res').textContent);toast('Copied')}catch(_){}};
function rh(){$('hl').innerHTML=hist.length?'':'<p style="color:var(--mut);padding:12px">No history yet</p>';hist.forEach(h=>{const d=document.createElement('div');d.className='hi';d.innerHTML='<small></small><b></b>';d.children[0].textContent=h.e;d.children[1].textContent='= '+h.r;d.onclick=()=>{ex=h.r;fresh=false;$('sheet').classList.remove('open');sync()};$('hl').appendChild(d)})}
$('hisB').onclick=()=>{rh();$('sheet').classList.add('open')};$('hx').onclick=()=>$('sheet').classList.remove('open');
$('hc').onclick=()=>{hist=[];try{localStorage.removeItem('gc_h2')}catch(_){}rh();sync()};
function tab(n){tabNow=n;[0,1,2,3].forEach(i=>{$('s'+i).classList.toggle('on',i==n)});document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==n))}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(+b.dataset.t));
/* ---------- tools ---------- */
const ck=(...a)=>a.forEach(x=>{if(!isFinite(x))throw 0});
const money=n=>{ck(n);return n.toLocaleString('en-IN',{maximumFractionDigits:2})};
const TD=new Date().toLocaleDateString('en-CA');
const pd=s=>{const[a,b,c]=String(s).split('-').map(Number);if(!a)throw 0;return new Date(a,b-1,c)};
const ymd=(a,b)=>{let y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth(),d=b.getDate()-a.getDate();if(d<0){m--;d+=new Date(b.getFullYear(),b.getMonth(),0).getDate()}if(m<0){y--;m+=12}return[y,m,d]};
const dstr=d=>d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const num=(id,l,d)=>({id,l,t:'number',d});
const U=(n,t,dk)=>{const ks=Object.keys(t);return{n,f:[num('v','Value',1),{id:'u',l:'From',t:'sel',o:ks,d:dk||ks[0]}],c:v=>{ck(v.v);return ks.map(k=>[k,fmt(v.v*t[v.u]/t[k])])}}};
const CUR={USD:1,INR:94.3,EUR:.915,GBP:.78,JPY:150,AED:3.6725,AUD:1.52,CAD:1.38,CNY:7.2,SGD:1.34};
const cks=Object.keys(CUR);
const TOOLS={
Age:{n:'Age',e:'🎂',f:[{id:'b',l:'Date of birth',t:'date',d:'2000-01-01'},{id:'t',l:'Today',t:'date',d:TD}],c:v=>{const b=pd(v.b),t=pd(v.t);if(b>t)throw 0;const[y,m,d]=ymd(b,t);let nb=new Date(t.getFullYear(),b.getMonth(),b.getDate());if(nb<t)nb.setFullYear(nb.getFullYear()+1);const dy=Math.round((t-b)/864e5);return[['Age',y+' years '+m+' months '+d+' days'],['Next birthday',dstr(nb)+' ('+Math.round((nb-t)/864e5)+' days)'],['Months',y*12+m],['Weeks',Math.floor(dy/7)],['Days',dy],['Hours',dy*24],['Minutes',dy*1440]]}},
Area:U('Area',{'m²':1,'km²':1e6,ha:1e4,'cm²':1e-4,'mm²':1e-6,'ft²':.09290304,'in²':6.4516e-4,'yd²':.83612736,acre:4046.8564224,'mi²':2589988.110336},'m²'),
BMI:{n:'BMI',e:'⚖️',f:[num('h','Height (cm)',170),num('w','Weight (kg)',65)],c:v=>{ck(v.h,v.w);if(v.h<=0)throw 0;const b=v.w/Math.pow(v.h/100,2);return[['BMI',b.toFixed(1)],['Category',b<18.5?'Underweight':b<25?'Normal':b<30?'Overweight':'Obese'],['Healthy weight range',(18.5*Math.pow(v.h/100,2)).toFixed(1)+' - '+(24.9*Math.pow(v.h/100,2)).toFixed(1)+' kg']]},big:1},
Data:U('Data',{bit:.125,B:1,KB:1024,MB:1048576,GB:1073741824,TB:1099511627776,PB:1125899906842624},'GB'),
Date:{n:'Date',e:'📅',f:[{id:'a',l:'From',t:'date',d:TD},{id:'b',l:'To',t:'date',d:TD},num('n','Add or subtract days',30)],c:v=>{const a=pd(v.a),b=pd(v.b),[x,y]=a<=b?[a,b]:[b,a],[Y,M,D]=ymd(x,y),n=Math.round((y-x)/864e5),k=+v.n||0,r=new Date(a);r.setDate(r.getDate()+k);return[['Difference',n+' days'],['In weeks',Math.floor(n/7)+' weeks '+n%7+' days'],['Calendar',Y+' y '+M+' m '+D+' d'],['From date '+(k>=0?'+ ':'- ')+Math.abs(k)+' days',dstr(r)]]}},
Discount:{n:'Discount',e:'🏷️',f:[num('p','Price',1000),num('d','Discount %',20),num('t','Tax %',0)],c:v=>{ck(v.p,v.d,v.t);const s=v.p*v.d/100,a=v.p-s,t=a*v.t/100;return[['Final price',money(a+t)],['You save',money(s)],['Price after discount',money(a)],['Tax',money(t)]]},big:1},
Length:U('Length',{mm:.001,cm:.01,m:1,km:1000,in:.0254,ft:.3048,yd:.9144,mi:1609.344,nmi:1852},'m'),
Mass:U('Mass',{mg:1e-6,g:.001,kg:1,t:1000,oz:.028349523,lb:.45359237,st:6.35029318},'kg'),

function graphUI(b){
 b.innerHTML='<div class="card"><label class="fl"><span>y₁ =</span><input id="g_f" value="sin(x)"></label><label class="fl"><span>y₂ =</span><input id="g_g" value="x^2/4"></label></div><div class="card" style="margin-top:12px;padding:8px"><canvas id="cv" style="width:100%;height:320px;touch-action:none;display:block"></canvas><div class="gz"><button class="ib" id="gzi">+</button><button class="ib" id="gzo">−</button><button class="ib" id="gzr">⟲</button><span id="gxy" class="note"></span></div></div><p class="note">Drag to pan. Use x with sin, cos, tan, ln, lg, √, ^, π, ℯ. Angles are in radians.</p>';
 const V={cx:0,cy:0,s:40},cv=$('cv');

 function draw(){const r=cv.getBoundingClientRect(),dp=devicePixelRatio||1;cv.width=r.width*dp;cv.height=r.height*dp;const g=cv.getContext('2d');g.scale(dp,dp);const W=r.width,H=r.height;
  const X=px=>(px-W/2)/V.s+V.cx,PX=x=>(x-V.cx)*V.s+W/2,PY=y=>H/2-(y-V.cy)*V.s;
  const tg=60/V.s,pw=Math.pow(10,Math.floor(Math.log10(tg))),st=[1,2,5,10].map(m=>m*pw).find(v=>v>=tg);
  g.font='10px '+getComputedStyle(document.body).fontFamily;g.fillStyle='#8e8e93';g.strokeStyle='#e5e5ea';g.lineWidth=1;g.beginPath();
  for(let x=Math.ceil(X(0)/st)*st;x<=X(W);x+=st){g.moveTo(PX(x),0);g.lineTo(PX(x),H);g.fillText(fmt(+x.toPrecision(6)),PX(x)+2,Math.min(H-3,Math.max(10,PY(0)+11)))}
  for(let y=Math.ceil((V.cy-H/2/V.s)/st)*st;y<=V.cy+H/2/V.s;y+=st){g.moveTo(0,PY(y));g.lineTo(W,PY(y));if(Math.abs(y)>st/2)g.fillText(fmt(+y.toPrecision(6)),Math.min(W-30,Math.max(2,PX(0)+3)),PY(y)-2)}
  g.stroke();g.strokeStyle='#1c1c1e';g.lineWidth=1.5;g.beginPath();g.moveTo(PX(0),0);g.lineTo(PX(0),H);g.moveTo(0,PY(0));g.lineTo(W,PY(0));g.stroke();
  [['g_f','#0a84ff'],['g_g','#1c1c1e']].forEach(([id,col])=>{const src=$(id).value.trim();if(!src)return;g.strokeStyle=col;g.lineWidth=2.2;g.beginPath();let on=false;
   for(let px=0;px<=W;px+=1){const y=val(src,X(px)),py=PY(y);if(isFinite(y)&&Math.abs(py)<H*3){on?g.lineTo(px,py):g.moveTo(px,py);on=true}else on=false}g.stroke()})}
 let dr=null;

 cv.onpointerup=cv.onpointercancel=()=>dr=null;
 cv.onpointermove=e=>{const r=cv.getBoundingClientRect();if(dr){V.cx-=(e.clientX-dr[0])/V.s;V.cy+=(e.clientY-dr[1])/V.s;dr=[e.clientX,e.clientY];draw()}
  const x=(e.clientX-r.left-r.width/2)/V.s+V.cx,y=val($('g_f').value,x);$('gxy').textContent='x = '+fmt(+x.toPrecision(5))+(isFinite(y)?'   y₁ = '+fmt(+y.toPrecision(5)):'')};

 $('g_f').oninput=$('g_g').oninput=draw;setTimeout(draw,60)}
