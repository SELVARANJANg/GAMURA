<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gamura Links</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#f2f6f4;--card:rgba(255,255,255,.78);--ink:#13231c;--mute:#6b7d74;--line:rgba(19,35,28,.09);--acc:#0fa874;--acc2:#0a7d57;--accsoft:rgba(15,168,116,.12);--glass:rgba(242,246,244,.8);--shadow:0 1px 2px rgba(19,35,28,.06),0 8px 28px rgba(19,35,28,.07);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07110d;--card:rgba(20,33,27,.78);--ink:#e8f3ee;--mute:#8aa196;--line:rgba(232,243,238,.1);--acc:#2fd49a;--acc2:#1fb683;--accsoft:rgba(47,212,154,.14);--glass:rgba(7,17,13,.8);--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#07110d;--card:rgba(20,33,27,.78);--ink:#e8f3ee;--mute:#8aa196;--line:rgba(232,243,238,.1);--acc:#2fd49a;--acc2:#1fb683;--accsoft:rgba(47,212,154,.14);--glass:rgba(7,17,13,.8);--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.glow{position:fixed;inset:-20% -20% auto;height:420px;background:radial-gradient(60% 60% at 50% 0,var(--accsoft),transparent 70%);pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:20px 18px 120px}
h1{font-size:34px;line-height:1.1;letter-spacing:-.03em;margin:8px 0 4px;font-weight:700}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);backdrop-filter:saturate(1.6) blur(22px);-webkit-backdrop-filter:saturate(1.6) blur(22px);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.maker{padding:16px;display:grid;gap:10px;margin-bottom:22px}
.field{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:0 14px;min-height:48px}
.field:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--accsoft)}
.field span{color:var(--mute);white-space:nowrap;font-size:15px}
input{all:unset;flex:1;min-width:0;padding:12px 0;font-size:16px;color:var(--ink)}
input::placeholder{color:var(--mute);opacity:.7}
button{font:inherit;cursor:pointer;border:0}
.btn{background:var(--acc);color:#fff;font-weight:600;border-radius:14px;min-height:48px;padding:0 18px;transition:transform .15s,background .15s}
:root[data-theme="dark"] .btn{color:#04150e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#04150e}}
.btn:active{transform:scale(.97);background:var(--acc2)}
.ghost{background:var(--accsoft);color:var(--acc2);font-weight:600;border-radius:12px;min-height:40px;padding:0 14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ghost{color:var(--acc)}}
:root[data-theme="dark"] .ghost{color:var(--acc)}
.danger{background:rgba(220,60,60,.12);color:#d23c3c}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.err{color:#d23c3c;font-size:14px;min-height:18px;margin:0}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left;background:none;color:inherit;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.ico{width:42px;height:42px;border-radius:12px;background:var(--accsoft);color:var(--acc2);display:grid;place-items:center;font-weight:700;flex:none;font-size:17px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ico{color:var(--acc)}}
.meta{flex:1;min-width:0}
.meta b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta small{display:block;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{text-align:right}
.count b{font-size:20px;letter-spacing:-.02em;display:block;line-height:1}
.count small{color:var(--mute);font-size:12px}
.empty{padding:38px 20px;text-align:center;color:var(--mute)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{padding:16px}
.stat b{font-size:32px;letter-spacing:-.03em;display:block;line-height:1.1}
.stat small{color:var(--mute)}
.block{padding:18px;margin-bottom:14px}
.block h3{margin:0 0 12px;font-size:17px}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:12px;color:var(--mute)}
.bar i{display:block;width:100%;background:linear-gradient(var(--acc),var(--acc2));border-radius:8px 8px 4px 4px;min-height:4px;transition:height .4s}
.split{display:grid;gap:10px}
.split div{display:grid;grid-template-columns:90px 1fr 34px;align-items:center;gap:10px;font-size:14px}
.track{height:8px;background:var(--accsoft);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--acc);border-radius:99px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--glass);backdrop-filter:saturate(1.6) blur(22px);-webkit-backdrop-filter:saturate(1.6) blur(22px);border-top:1px solid var(--line)}
nav div{display:flex;gap:6px;background:var(--accsoft);padding:4px;border-radius:16px;width:100%;max-width:360px}
nav button{flex:1;min-height:42px;border-radius:12px;background:none;color:var(--mute);font-weight:600}
nav button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.back{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.back.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:640px;margin:0 auto;max-height:90vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:14px 18px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.qr{width:168px;height:168px;margin:0 auto 12px;background:#fff;border-radius:18px;padding:12px;display:block}
.qr svg{width:100%;height:100%;display:block}
.short{text-align:center;font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0 0 2px;word-break:break-all}
.dest{text-align:center;color:var(--mute);font-size:14px;margin:0 0 14px;word-break:break-all}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:40}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="glow"></div>
<main>
  <section id="v-links">
    <h1>Links</h1>
    <p class="sub">Short links and QR codes, with clicks you can read.</p>
    <div class="card maker">
      <label class="field"><input id="url" type="url" inputmode="url" autocomplete="off" placeholder="Paste a long link" aria-label="Long link"></label>
      <label class="field"><span>gamura.vercel.app/x/</span><input id="slug" autocomplete="off" autocapitalize="off" maxlength="24" placeholder="custom-name (optional)" aria-label="Custom name"></label>
      <p class="err" id="err" role="alert"></p>
      <button class="btn" id="make">Create short link</button>
    </div>
    <div class="card" id="list"></div>
  </section>
  <section id="v-insights" class="hide">
    <h1>Insights</h1>
    <p class="sub">Every click across all your links.</p>
    <div id="ins"></div>
  </section>
</main>
<nav><div role="tablist">
  <button role="tab" id="t-links" aria-selected="true">Links</button>
  <button role="tab" id="t-insights" aria-selected="false">Insights</button>
</div></nav>
<div class="back" id="back"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Link details"></div>
<div class="toast" id="toast" role="status"></div>
<script>
var BASE="gamura.vercel.app/x/";
var COUNTRIES=["India","India","India","United States","UAE","Singapore","Germany","Japan"];
var DEVICES=["Mobile","Mobile","Mobile","Desktop","Desktop","Tablet"];
var mem=null,links=[],openId=null;
function $(s){return document.querySelector(s)}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function load(){try{var r=localStorage.getItem("gl_links");if(r)return JSON.parse(r)}catch(e){}return mem}
function save(){mem=links;try{localStorage.setItem("gl_links",JSON.stringify(links))}catch(e){}}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function fakeClicks(n,days){var o=[];for(var i=0;i<n;i++){o.push({t:Date.now()-Math.random()*days*864e5,c:rnd(COUNTRIES),d:rnd(DEVICES)})}return o}
function host(u){try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return u}}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("on")},1600)}
function copy(txt){try{navigator.clipboard.writeText(txt).then(function(){toast("Copied")},function(){toast("Copy not allowed here")})}catch(e){toast("Copy not allowed here")}}
function makeSlug(){var c="abcdefghjkmnpqrstuvwxyz23456789",s="";for(var i=0;i<5;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
function create(){
  var u=$("#url").value.trim(),s=$("#slug").value.trim().toLowerCase(),e=$("#err");e.textContent="";
  if(!u){e.textContent="Paste the link you want to shorten.";return}
  if(!/^https?:\/\//i.test(u))u="https://"+u;
  try{var p=new URL(u);if(p.hostname.indexOf(".")<0)throw 0}catch(x){e.textContent="That link looks incomplete. Check it and try again.";return}
  if(s&&!/^[a-z0-9-]{2,24}$/.test(s)){e.textContent="Custom names use 2 to 24 letters, numbers or hyphens.";return}
  if(!s){do{s=makeSlug()}while(links.some(function(l){return l.slug===s}))}
  if(links.some(function(l){return l.slug===s})){e.textContent="That name is taken. Try another.";return}
  links.unshift({id:Date.now()+"",slug:s,url:u,created:Date.now(),clicks:[]});
  save();$("#url").value="";$("#slug").value="";render();toast("Link created");open(links[0].id);
}
function dayCounts(arr){var out=[],now=new Date();now.setHours(0,0,0,0);for(var i=6;i>=0;i--){var a=now.getTime()-i*864e5,b=a+864e5,n=0;arr.forEach(function(k){if(k.t>=a&&k.t<b)n++});out.push({l:["Su","Mo","Tu","We","Th","Fr","Sa"][new Date(a).getDay()],n:n})}return out}
function tally(arr,key){var m={};arr.forEach(function(k){m[k[key]]=(m[k[key]]||0)+1});return Object.keys(m).map(function(n){return{n:n,v:m[n]}}).sort(function(a,b){return b.v-a.v})}
function bars(arr){var d=dayCounts(arr),mx=Math.max.apply(null,d.map(function(x){return x.n}).concat(1));return '<div class="bars">'+d.map(function(x){return '<div class="bar"><span>'+x.n+'</span><i style="height:'+Math.max(4,x.n/mx*80)+'px"></i><span>'+x.l+'</span></div>'}).join("")+"</div>"}
function split(arr,key){var t=tally(arr,key).slice(0,5),tot=arr.length||1;if(!t.length)return '<p class="sub" style="margin:0">No clicks yet.</p>';return '<div class="split">'+t.map(function(x){return '<div><span>'+esc(x.n)+'</span><span class="track"><i style="width:'+Math.round(x.v/tot*100)+'%"></i></span><b>'+x.v+"</b></div>"}).join("")+"</div>"}
function render(){
  var L=$("#list");
  if(!links.length){L.innerHTML='<div class="empty">No links yet. Paste one above and create your first short link.</div>'}
  else{L.innerHTML=links.map(function(l){return '<button class="row" data-id="'+l.id+'"><span class="ico">'+esc(host(l.url).charAt(0).toUpperCase())+'</span><span class="meta"><b>/x/'+esc(l.slug)+'</b><small>'+esc(host(l.url))+'</small></span><span class="count"><b>'+l.clicks.length+'</b><small>clicks</small></span></button>'}).join("")}
  var all=[];links.forEach(function(l){all=all.concat(l.clicks)});
  var top=links.slice().sort(function(a,b){return b.clicks.length-a.clicks.length})[0];
  var wk=all.filter(function(k){return k.t>Date.now()-7*864e5}).length;
  $("#ins").innerHTML='<div class="stats"><div class="card stat"><b>'+all.length+'</b><small>Total clicks</small></div><div class="card stat"><b>'+wk+'</b><small>Last 7 days</small></div></div>'+
  '<div class="card block"><h3>Clicks this week</h3>'+bars(all)+'</div>'+
  '<div class="card block"><h3>Devices</h3>'+split(all,"d")+'</div>'+
  '<div class="card block"><h3>Countries</h3>'+split(all,"c")+'</div>'+
  (top&&top.clicks.length?'<div class="card block"><h3>Top link</h3><p style="margin:0"><b>/x/'+esc(top.slug)+'</b> with '+top.clicks.length+' clicks</p></div>':"");
}
function open(id){
  var l=links.filter(function(x){return x.id===id})[0];if(!l)return;openId=id;
  var short=BASE+l.slug,qr=qrcode(0,"M");qr.addData("https://"+short);qr.make();
  $("#sheet").innerHTML='<div class="grab"></div><span class="qr">'+qr.createSvgTag({cellSize:4,margin:0,scalable:true})+'</span><p class="short">'+esc(short)+'</p><p class="dest">'+esc(l.url)+'</p>'+
  '<div class="acts"><button class="btn" id="a-copy">Copy link</button><button class="ghost" id="a-dl">Save QR</button><button class="ghost" id="a-test">Add a test click</button><button class="ghost danger" id="a-del">Delete</button></div>'+
  '<div class="card block"><h3>Clicks this week</h3>'+bars(l.clicks)+'</div><div class="card block"><h3>Devices</h3>'+split(l.clicks,"d")+'</div><div class="card block"><h3>Countries</h3>'+split(l.clicks,"c")+'</div>';
  $("#a-copy").onclick=function(){copy("https://"+short)};
  $("#a-test").onclick=function(){l.clicks.push({t:Date.now(),c:rnd(COUNTRIES),d:rnd(DEVICES)});save();render();open(id);toast("Click recorded")};
  $("#a-del").onclick=function(){links=links.filter(function(x){return x.id!==id});save();close();render();toast("Link deleted")};
  $("#a-dl").onclick=function(){try{var a=document.createElement("a");a.href=qr.createDataURL(10,16);a.download="gamura-"+l.slug+".png";a.click()}catch(e){toast("Save not allowed here")}};
  $("#sheet").classList.add("on");$("#back").classList.add("on");
}
function close(){$("#sheet").classList.remove("on");$("#back").classList.remove("on");openId=null}
function tab(w){["links","insights"].forEach(function(n){$("#v-"+n).classList.toggle("hide",n!==w);$("#t-"+n).setAttribute("aria-selected",n===w)});window.scrollTo(0,0)}
links=load()||[];
if(!links.length){links=[{id:"s1",slug:"galaxy",url:"https://gamuragalaxy.vercel.app/",created:Date.now(),clicks:fakeClicks(42,7)},{id:"s2",slug:"rollout",url:"https://gamuraro.vercel.app/",created:Date.now(),clicks:fakeClicks(17,7)}];save()}
$("#make").onclick=create;
$("#slug").onkeydown=$("#url").onkeydown=function(e){if(e.key==="Enter")create()};
$("#list").onclick=function(e){var r=e.target.closest(".row");if(r)open(r.getAttribute("data-id"))};
$("#back").onclick=close;
document.onkeydown=function(e){if(e.key==="Escape")close()};
$("#t-links").onclick=function(){tab("links")};
$("#t-insights").onclick=function(){tab("insights")};
render();
</script>
</body>
</html>
